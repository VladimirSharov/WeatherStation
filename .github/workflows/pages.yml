# Publishes the dashboard to GitHub Pages. With no receiver API behind it, the
# page switches to its in-browser demo mode, which makes a live showcase.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Dashboard demo

on:
  push:
    branches: [main, master]
    paths: ["receiver/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: receiver/static
      - id: deployment
        uses: actions/deploy-pages@v5
